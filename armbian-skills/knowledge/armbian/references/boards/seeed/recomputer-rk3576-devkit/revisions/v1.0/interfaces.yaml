protected_internal_signals:
- regulator enables
- USB power/reset
- EEPROM write protect
- boot/reset/recovery
- PCIe reset/power
- Wi-Fi/BT power/reset
- system LED consumer
- fan/thermal control
internal_i2c4_source_devices:
- address: '0x18'
  device: ES8311 codec
- address: '0x21'
  device: PCA9535 GPIO expander
- address: '0x22'
  device: FUSB302 Type-C controller
- address: '0x51'
  device: PCF8563 RTC
- address: '0x57'
  device: AT24C256 EEPROM
internal_i2c_policy: 'Shared header/onboard I2C4: no address scan, unscoped raw transfers, raw GPIO takeover or
  forced driver access. Only confirmed external device/address/protocol transactions after current mapping, electrical,
  owner and authorization checks.'
gpio_expander_source_lines:
- offset: 8
  name: USER_LED_R
- offset: 9
  name: USER_LED_B
  consumer: user-led heartbeat
- offset: 10
  name: USER_LED_G
known_conflicts:
- id: vendor-pin-labels-vs-schematic
  detail: 26 of 28 vendor PIN_* pad claims differ from the V1.0 J3 schematic trace; only PIN_8/10 agree. Runtime
    label presence does not validate a physical mapping.
- id: official-pin26-spi-label
  detail: Official SPI_CSN/GPIO label on pin 26 conflicts with traced GPIO0_C7; SPI3 m1 CS0 is GPIO3_B6 on Ethernet,
    not J3. Pin 24 is CS1.
- id: header-i2c4-shared
  detail: J3-27/28 trace to I2C4 m3 shared with onboard devices, not an isolated external EEPROM bus.
sources_of_truth_note: Use schematic-mapping for documented J3 net/pad/controller identity; preserve PIN_* entries
  here only as source/runtime label claims. No physical measurement or GPIO functional test.
