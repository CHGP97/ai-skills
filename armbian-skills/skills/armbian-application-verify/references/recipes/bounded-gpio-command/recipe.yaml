schema_version: '1'
id: recipe.bounded-gpio-command
kind: recipe
applies_to:
  capabilities:
  - gpio
  operations:
  - gpio.output
required_refs:
- common.project-integration
- capability.gpio
- common.deployment
- common.verification
preconditions:
- field: facts.hardware.pin_mapping_verified
  operator: eq
  value: true
- field: facts.hardware.signal_voltage_verified
  operator: eq
  value: true
- field: facts.hardware.line_busy
  operator: eq
  value: false
refines: []
excludes:
- when:
  - field: facts.hardware.protected
    operator: eq
    value: true
  reason: System-protected or shared control signals must not be seized by a GPIO recipe
  evidence_refs:
  - common.linux-device-access
  - capability.gpio
related: []
sources: []
validation_refs: []
maturity: documented
owner: armbian-platform-maintainers
updated_at: '2026-10-19'
implementation_status: engineering_pattern
functional_acceptance: must_validate_on_current_target
target_defaults: null
