<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc">
<title id="title">reComputer RK3576 J3 to AHT20 wiring example</title>
<desc id="desc">Board-specific header layout is shown only when its observation side and orientation are documented. J3-1 3.3V to VCC; J3-14 GND to GND; J3-27 I2C4 SDA to SDA; J3-28 I2C4 SCL to SCL. Verify target and module before wiring. Module terminal order is not depicted.</desc>
